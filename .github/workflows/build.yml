name: Build Windows plugin

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the "bounce-latest" pre-release with the ready-to-install zip

jobs:
  windows:
    name: Windows x64 (build, test, pluginval, package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip"
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 10 --validate-in-process \
            --validate "build/plugin/Bounce_artefacts/Release/VST3/Bounce.vst3"

      - name: Package
        shell: pwsh
        run: |
          $out = "Bounce-Windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse "build/plugin/Bounce_artefacts/Release/VST3/Bounce.vst3" "$out/"
          Copy-Item "build/plugin/Bounce_artefacts/Release/Standalone/Bounce.exe" "$out/"
          Copy-Item "packaging/windows/install.bat" "$out/"
          Copy-Item "packaging/windows/README.txt" "$out/"
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Bounce-Windows-x64
          path: Bounce-Windows-x64

      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f bounce-latest
          git push -f origin bounce-latest
          gh release delete bounce-latest --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create bounce-latest Bounce-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Bounce (latest Windows build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Unzip, run install.bat as administrator, then rescan plugins in FL Studio."
